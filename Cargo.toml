[package]
name = "tome"
version = "0.1.0"
edition = "2024"
description = "A text viewer, editor and converter built for huge files"
license = "MIT"
repository = "https://github.com/Peckage/tome"
readme = "README.md"
keywords = ["text-editor", "large-files", "xml", "json", "converter"]
categories = ["text-editors", "command-line-utilities", "parsing"]

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
# Icons and symbols (📂 💾 ● ◀ ▶ ✕) need the bundled emoji fonts, a separate feature since egui 0.37.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
encoding_rs = "0.8"
memchr = "2.8"
memmap2 = "0.9"
rayon = "1.12"
regex = "1.13"
rfd = "0.17"
png = { version = "0.18", optional = true }

[features]
# Screenshot mode for the README (TOME_SCREENSHOT / TOME_DEMO).
screenshots = ["dep:png"]

[profile.release]
lto = "fat"
codegen-units = 1
debug = false

[profile.dev.package."*"]
opt-level = 2
