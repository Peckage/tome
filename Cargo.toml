[package]
name = "tome"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
encoding_rs = "0.8"
memchr = "2.8"
memmap2 = "0.9"
rayon = "1.12"
regex = "1.13"
rfd = "0.17"

[profile.release]
lto = "fat"
codegen-units = 1
debug = false

[profile.dev.package."*"]
opt-level = 2
