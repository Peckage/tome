name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # .cargo/config.toml builds for the local CPU; CI machines differ
          # (and share a cache), so pin a portable target instead.
          - os: ubuntu-22.04
            rustflags: -C target-cpu=x86-64-v2
          - os: windows-latest
            rustflags: -C target-cpu=x86-64-v2
          - os: macos-latest
            rustflags: -C target-cpu=apple-m1
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Build
        run: cargo build --release
      - name: Unit and window tests
        run: cargo test --release
      - name: Compare with the Python reference
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --user pyyaml
          python3 tests/compare_with_python.py --random 200
