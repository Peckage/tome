name: Release

# Push a tag like v0.1.0 to build everything and publish a GitHub release.
# Run it by hand (Actions → Release → Run workflow) to build and smoke-test
# the downloads without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portable CPU targets (the repo's config builds for the local CPU).
          # ubuntu-22.04 links glibc 2.35, so the binary runs on most current distributions.
          - name: linux-x86_64
            os: ubuntu-22.04
            rustflags: -C target-cpu=x86-64-v2
          # crt-static: no Visual C++ runtime to install on the user's machine.
          - name: windows-x86_64
            os: windows-latest
            rustflags: -C target-cpu=x86-64-v2 -C target-feature=+crt-static
          - name: macos-arm64
            os: macos-latest
            rustflags: -C target-cpu=apple-m1
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Version
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            if [ "$version" != "$crate" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $crate in Cargo.toml"
              exit 1
            fi
          else
            version=$crate
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "STAGE=tome-v$version-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          mkdir -p dist "$STAGE"
          cargo build --release --locked
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/tome.exe "$STAGE/tome.exe"
            # The same program as a console program, for terminals.
            cargo build --release --locked --features console
            cp target/release/tome.exe "$STAGE/tome-cli.exe"
          else
            cp target/release/tome "$STAGE/tome"
          fi
          cp README.md LICENSE "$STAGE/"

      - name: Smoke test
        run: |
          printf '<parts><part id="7"><name>Bolt</name></part><part id="8"/></parts>' > smoke.xml
          expected=$(printf '[\n{"id":"7","name":[{"#text":"Bolt"}]},\n{"id":"8"}\n]')
          programs="$STAGE/tome"
          [ "$RUNNER_OS" = Windows ] && programs="$STAGE/tome-cli.exe $STAGE/tome.exe"
          for program in $programs; do
            "$program" --help > help.txt
            grep -qi usage help.txt
            rm -f smoke.json
            "$program" smoke.xml smoke.json
            got=$(tr -d '\r' < smoke.json)
            if [ "$got" != "$expected" ]; then
              echo "::error::$program converted to: $got"
              exit 1
            fi
            if "$program" missing.xml out.json 2>/dev/null; then
              echo "::error::$program did not fail on a missing file"
              exit 1
            fi
            echo "$program ok"
          done

      - name: Check the Windows executables need no extra DLLs
        if: runner.os == 'Windows'
        run: |
          python -m pip install --quiet pefile
          python - "$STAGE/tome.exe" "$STAGE/tome-cli.exe" <<'EOF'
          import sys, pefile
          for path in sys.argv[1:]:
              pe = pefile.PE(path)
              dlls = sorted(e.dll.decode().lower() for e in pe.DIRECTORY_ENTRY_IMPORT)
              subsystem = pe.OPTIONAL_HEADER.Subsystem  # 2 = GUI, 3 = console
              print(path, "subsystem", subsystem, dlls)
              bad = [d for d in dlls if d.startswith(("vcruntime", "msvcp", "api-ms-win-crt", "ucrtbase"))]
              assert not bad, f"{path} needs the C runtime: {bad}"
              want = 3 if path.endswith("tome-cli.exe") else 2
              assert subsystem == want, f"{path}: subsystem {subsystem}, expected {want}"
          EOF

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp install.sh "$STAGE/"
          cp data/tome.svg "$STAGE/tome.svg"
          tar czf "dist/$STAGE.tar.gz" "$STAGE"
          packaging/linux/build-deb.sh "$STAGE/tome" "$VERSION" dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path $env:STAGE -DestinationPath "dist/$env:STAGE.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\$env:STAGE" "/DOutputDir=$PWD\dist" packaging\windows\tome.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: tar czf "dist/$STAGE.tar.gz" "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          cat > notes.md <<EOF
          ## Download

          | System | File |
          |---|---|
          | Windows 10/11 (x64) | **tome-v$v-windows-x86_64-setup.exe** (installer), or the \`.zip\` (portable, no install) |
          | Ubuntu, Debian, Pop!_OS, Mint (x64) | **tome_${v}_amd64.deb** |
          | Any other Linux (x64, glibc 2.35+) | **tome-v$v-linux-x86_64.tar.gz**: unpack it and run \`./install.sh\` |
          | macOS (Apple silicon) | **tome-v$v-macos-arm64.tar.gz** |

          The Windows installer is not code-signed, so SmartScreen may warn: choose **More info → Run anyway**. On macOS, right-click \`tome\` and choose Open the first time. \`SHA256SUMS.txt\` has the checksums.

          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Tome $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
