name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Portable CPU targets (the repo's config builds for the local CPU).
          # ubuntu-22.04 links an older glibc, so the binary runs on more systems.
          - name: linux-x86_64
            os: ubuntu-22.04
            rustflags: -C target-cpu=x86-64-v2
            binary: tome
          - name: windows-x86_64
            os: windows-latest
            rustflags: -C target-cpu=x86-64-v2
            binary: tome.exe
          - name: macos-arm64
            os: macos-latest
            rustflags: -C target-cpu=apple-m1
            binary: tome
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Build
        run: cargo build --release
      - name: Package
        shell: bash
        run: |
          dir=tome-${GITHUB_REF_NAME}-${{ matrix.name }}
          mkdir "$dir"
          cp target/release/${{ matrix.binary }} README.md LICENSE "$dir"/
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Tome $GITHUB_REF_NAME" --generate-notes
